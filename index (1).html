<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UniConvert</title>
<style>
  body { font-family: Arial, sans-serif; background:#f2f5f9; margin:0; padding:16px; }
  .card { max-width:520px; margin:auto; background:#fff; border-radius:16px; padding:20px; box-shadow:0 2px 10px rgba(0,0,0,.12); }
  h1 { text-align:center; font-size:22px; margin:0 0 12px; color:#0a5; }
  .tabs { display:flex; gap:8px; margin-bottom:14px; }
  .tabs button { flex:1; margin:0; padding:10px; font-size:15px; border:none; border-radius:10px; background:#e3e8ee; }
  .tabs button.active { background:#0a7d2c; color:#fff; }
  label { display:block; margin:12px 0 4px; font-size:15px; color:#444; }
  select, input[type=number], input[type=text] { width:100%; padding:12px; font-size:17px; border:1px solid #bbb; border-radius:10px; box-sizing:border-box; }
  button { width:100%; margin-top:12px; padding:10px; font-size:16px; border:none; border-radius:10px; background:#e3e8ee; }
  button.main { background:#0a7d2c; color:#fff; }
  .result { margin-top:16px; padding:16px; text-align:center; font-size:26px; font-weight:bold; color:#0a7d2c; background:#eaf8ef; border-radius:12px; word-break:break-all; }
  .hidden { display:none; }
  table { width:100%; border-collapse:collapse; margin-top:14px; font-size:14px; }
  th, td { border:1px solid #ccc; padding:8px; text-align:center; }
  th { background:#eaf8ef; }
  .note { font-size:13px; color:#666; margin-top:8px; }
</style>
</head>
<body>
<div class="card">
  <h1>UniConvert</h1>
  <div class="tabs">
    <button id="tab1" class="active">محوّل الوحدات</button>
    <button id="tab2">بحث وتحويل من PDF</button>
  </div>

  <!-- التبويب الأول: المحوّل -->
  <div id="page1">
    <label>نوع القياس</label>
    <select id="category"></select>
    <label>من وحدة</label>
    <select id="from"></select>
    <button id="swap">⇅ تبديل الوحدتين</button>
    <label>إلى وحدة</label>
    <select id="to"></select>
    <label>اكتبي الرقم</label>
    <input id="value" type="number" inputmode="decimal" value="1">
    <div class="result" id="result"></div>
  </div>

  <!-- التبويب التاني: PDF -->
  <div id="page2" class="hidden">
    <label>اختاري ملفات PDF</label>
    <input id="files" type="file" accept="application/pdf" multiple>
    <label>كلمة البحث (مثلاً: ثلاجة)</label>
    <input id="word" type="text" placeholder="اكتبي الكلمة">
    <label>نوع القياس اللي بتدوري عليه</label>
    <select id="pdfCategory"></select>
    <label>حوّلي كل القياسات إلى</label>
    <select id="pdfTarget"></select>
    <button id="searchBtn" class="main">ابحثي وحوّلي</button>
    <div class="note" id="pdfStatus"></div>
    <div id="pdfResults"></div>
    <div class="note">الأداة بتدور في كل صفحة على الأسطر اللي فيها كلمة البحث، وتلقط منها الأرقام اللي جنبها وحدة قياس من النوع المختار. الملفات المصورة (ممسوحة ضوئياً) مش هتتقرأ. الملفات بتتقرأ على جهازك ومبتترفعش.</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
if (window.pdfjsLib) {
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
}

// كل وحدة: [الاسم الظاهر, المعامل, كلمات بتتعرف بيها في النص]
const CATEGORIES = {
  "الطول": [
    ["متر (m)", 1, ["متر", "م", "m", "meter", "meters"]],
    ["سنتيمتر (cm)", 0.01, ["سم", "سنتيمتر", "سنتي", "cm"]],
    ["ملليمتر (mm)", 0.001, ["مم", "ملليمتر", "ملم", "mm"]],
    ["كيلومتر (km)", 1000, ["كم", "كيلومتر", "km"]],
    ["بوصة (inch)", 0.0254, ["بوصة", "انش", "إنش", "inch", "in", "\""]],
    ["قدم (foot)", 0.3048, ["قدم", "ft", "foot", "feet"]],
    ["ياردة (yard)", 0.9144, ["ياردة", "yd", "yard"]],
    ["ميل (mile)", 1609.344, ["ميل", "mile", "miles"]]
  ],
  "الكتلة (الوزن)": [
    ["كيلوجرام (kg)", 1, ["كجم", "كيلو", "كيلوجرام", "kg"]],
    ["جرام (g)", 0.001, ["جم", "جرام", "g"]],
    ["ملليجرام (mg)", 0.000001, ["ملجم", "ملليجرام", "mg"]],
    ["طن (ton)", 1000, ["طن", "ton", "tons"]],
    ["رطل (pound)", 0.45359237, ["رطل", "lb", "lbs", "pound"]],
    ["أونصة (ounce)", 0.028349523, ["اونصة", "أونصة", "oz", "ounce"]]
  ],
  "المساحة": [
    ["متر مربع (m²)", 1, ["م²", "م2", "m²", "m2"]],
    ["سنتيمتر مربع (cm²)", 0.0001, ["سم²", "سم2", "cm²", "cm2"]],
    ["كيلومتر مربع (km²)", 1000000, ["كم²", "كم2", "km²", "km2"]],
    ["هكتار (hectare)", 10000, ["هكتار", "ha"]],
    ["فدان (feddan)", 4200.83, ["فدان"]]
  ],
  "الحجم": [
    ["متر مكعب (m³)", 1, ["م³", "م3", "m³", "m3"]],
    ["لتر (L)", 0.001, ["لتر", "l", "liter", "litre"]],
    ["مليلتر (mL)", 0.000001, ["مل", "ml"]],
    ["سنتيمتر مكعب (cm³)", 0.000001, ["سم³", "سم3", "cm³", "cm3"]]
  ],
  "الضغط": [
    ["باسكال = نيوتن/متر مربع (Pa)", 1, ["باسكال", "pa", "n/m²", "n/m2"]],
    ["كيلوباسكال (kPa)", 1000, ["kpa", "كيلوباسكال"]],
    ["ضغط جوي (atm)", 101325, ["atm", "ضغط جوي", "اتموسفير", "أتموسفير"]],
    ["بار (bar)", 100000, ["bar", "بار"]],
    ["ملم زئبق (mmHg)", 133.322, ["mmhg", "ملم زئبق"]],
    ["رطل/بوصة مربعة (psi)", 6894.757, ["psi"]]
  ],
  "القوة": [
    ["نيوتن (N)", 1, ["نيوتن", "n"]],
    ["كيلونيوتن (kN)", 1000, ["kn", "كيلونيوتن"]],
    ["داين (dyne)", 0.00001, ["داين", "dyne"]],
    ["كيلوجرام قوة (kgf)", 9.80665, ["kgf"]]
  ],
  "الطاقة": [
    ["جول (J)", 1, ["جول", "j"]],
    ["كيلوجول (kJ)", 1000, ["kj", "كيلوجول"]],
    ["سعر حراري (cal)", 4.184, ["cal", "سعر"]],
    ["كيلو سعر (kcal)", 4184, ["kcal", "كيلو سعر"]],
    ["كيلوواط ساعة (kWh)", 3600000, ["kwh", "كيلوواط ساعة"]]
  ],
  "الزمن": [
    ["ثانية (s)", 1, ["ثانية", "s", "sec"]],
    ["دقيقة (min)", 60, ["دقيقة", "min"]],
    ["ساعة (hour)", 3600, ["ساعة", "h", "hour", "hr"]],
    ["يوم (day)", 86400, ["يوم", "day", "days"]]
  ],
  "السرعة": [
    ["متر/ثانية (m/s)", 1, ["م/ث", "m/s"]],
    ["كيلومتر/ساعة (km/h)", 1 / 3.6, ["كم/س", "km/h", "kmh"]],
    ["ميل/ساعة (mph)", 0.44704, ["mph"]]
  ],
  "القدرة": [
    ["واط (W)", 1, ["واط", "w", "watt"]],
    ["كيلوواط (kW)", 1000, ["كيلوواط", "kw"]],
    ["حصان (HP)", 745.7, ["حصان", "hp"]]
  ],
  "درجة الحرارة": [
    ["سيلزيوس (°C)", 0, ["°c", "c", "سيلزيوس", "مئوية"]],
    ["فهرنهايت (°F)", 0, ["°f", "f", "فهرنهايت"]],
    ["كلفن (K)", 0, ["k", "كلفن"]]
  ]
};

const $ = id => document.getElementById(id);
const names = cat => CATEGORIES[cat].map(u => u[0]);
const factorOf = (cat, name) => CATEGORIES[cat].find(u => u[0] === name)[1];

function fill(select, items) {
  select.innerHTML = "";
  items.forEach(n => { const o = document.createElement("option"); o.textContent = n; select.appendChild(o); });
}

function toKelvin(v, unit) {
  if (unit.includes("°C")) return v + 273.15;
  if (unit.includes("°F")) return (v - 32) * 5 / 9 + 273.15;
  return v;
}
function fromKelvin(k, unit) {
  if (unit.includes("°C")) return k - 273.15;
  if (unit.includes("°F")) return (k - 273.15) * 9 / 5 + 32;
  return k;
}

// دالة التحويل العامة: بتشتغل في الصفحتين
function convert(cat, v, fromName, toName) {
  if (cat === "درجة الحرارة") return fromKelvin(toKelvin(v, fromName), toName);
  return v * factorOf(cat, fromName) / factorOf(cat, toName);
}
function pretty(n) { return Number(n.toPrecision(10)).toString(); }

/* ---------- التبويب الأول ---------- */
function calc() {
  const v = parseFloat($("value").value);
  if (isNaN(v)) { $("result").textContent = "اكتبي رقماً صحيحاً"; return; }
  $("result").textContent = pretty(convert($("category").value, v, $("from").value, $("to").value));
}
function onCategory() {
  const u = names($("category").value);
  fill($("from"), u); fill($("to"), u);
  $("to").selectedIndex = u.length > 1 ? 1 : 0;
  calc();
}
fill($("category"), Object.keys(CATEGORIES));
$("category").addEventListener("change", onCategory);
$("from").addEventListener("change", calc);
$("to").addEventListener("change", calc);
$("value").addEventListener("input", calc);
$("swap").addEventListener("click", () => {
  const a = $("from").selectedIndex; $("from").selectedIndex = $("to").selectedIndex; $("to").selectedIndex = a; calc();
});
onCategory();

/* ---------- التبويبات ---------- */
$("tab1").addEventListener("click", () => showTab(1));
$("tab2").addEventListener("click", () => showTab(2));
function showTab(n) {
  $("page1").classList.toggle("hidden", n !== 1);
  $("page2").classList.toggle("hidden", n !== 2);
  $("tab1").classList.toggle("active", n === 1);
  $("tab2").classList.toggle("active", n === 2);
}

/* ---------- التبويب التاني: PDF ---------- */
const pdfCats = Object.keys(CATEGORIES).filter(c => c !== "درجة الحرارة");
fill($("pdfCategory"), pdfCats);
function onPdfCategory() { fill($("pdfTarget"), names($("pdfCategory").value)); }
$("pdfCategory").addEventListener("change", onPdfCategory);
onPdfCategory();

// تحويل الأرقام العربية الهندية إلى أرقام عادية
function normalizeDigits(s) {
  // NFKC: بيحوّل الحروف العربية الشكلية (اللي بتطلع من بعض ملفات PDF) لحروف عادية
  return s.normalize("NFKC")
          .replace(/[٠-٩]/g, d => d.charCodeAt(0) - 0x0660)
          .replace(/[۰-۹]/g, d => d.charCodeAt(0) - 0x06F0)
          .replace(/٫/g, ".");
}

function escapeRegex(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }

// بيلقط (رقم + وحدة) من سطر نص حسب النوع المختار
function extractMeasures(text, cat) {
  const units = CATEGORIES[cat];
  const found = [];
  const flat = [];
  units.forEach(u => u[2].forEach(alias => flat.push([alias, u[0]])));
  // الأطول أولاً عشان "cm" ما يتلقطش على إنه "m"
  flat.sort((a, b) => b[0].length - a[0].length);
  const aliasPattern = flat.map(f => escapeRegex(f[0])).join("|");
  const re = new RegExp("(\\d+(?:[.,]\\d+)?)\\s*(" + aliasPattern + ")(?![A-Za-zء-ي²³\\d])", "gi");
  let m;
  while ((m = re.exec(text)) !== null) {
    const value = parseFloat(m[1].replace(",", "."));
    const alias = m[2].toLowerCase();
    const unit = flat.find(f => f[0].toLowerCase() === alias);
    if (unit) found.push({ value, unitName: unit[1], raw: m[0] });
  }
  return found;
}

// نفس الفكرة بس الوحدة قبل الرقم (لو الترتيب اتقلب): "سم 12"
function extractMeasuresReversed(text, cat) {
  const flat = [];
  CATEGORIES[cat].forEach(u => u[2].forEach(alias => flat.push([alias, u[0]])));
  flat.sort((a, b) => b[0].length - a[0].length);
  const aliasPattern = flat.map(f => escapeRegex(f[0])).join("|");
  const re = new RegExp("(^|[^A-Za-zء-ي²³\\d])(" + aliasPattern + ")\\s*(\\d+(?:[.,]\\d+)?)", "gi");
  const found = [];
  let m;
  while ((m = re.exec(text)) !== null) {
    const unit = flat.find(f => f[0].toLowerCase() === m[2].toLowerCase());
    if (unit) found.push({ value: parseFloat(m[3].replace(",", ".")), unitName: unit[1] });
  }
  return found;
}

// بتجرّب أشكال السطر وترجّع أول شكل فيه الكلمة وقياسات
function findMeasures(variants, word, cat) {
  const vs = variants.map(normalizeDigits).filter(v => v.toLowerCase().includes(word));
  if (!vs.length) return { wordFound: false, measures: [] };
  for (const v of vs) {
    const ms = extractMeasures(v, cat);
    if (ms.length) return { wordFound: true, measures: ms };
  }
  for (const v of vs) {
    const ms = extractMeasuresReversed(v, cat);
    if (ms.length) return { wordFound: true, measures: ms };
  }
  return { wordFound: true, measures: [] };
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;" }[c]));
}

// بيلمّ عناصر السطر (ممكن كل حرف عنصر لوحده) في نص واحد، وبيحط مسافة بس لو في فراغ حقيقي بين العناصر
function glueItems(list, desc, mapStr) {
  let out = "";
  for (let k = 0; k < list.length; k++) {
    const cur = list[k];
    if (k > 0) {
      const prev = list[k - 1];
      const size = Math.max(Math.abs(prev.transform[3] || 0), Math.abs(prev.transform[0] || 0), 1);
      const gap = desc
        ? prev.transform[4] - (cur.transform[4] + (cur.width || 0))
        : cur.transform[4] - (prev.transform[4] + (prev.width || 0));
      if (gap > size * 0.12) out += " ";
    }
    out += mapStr(cur.str);
  }
  return out.replace(/\s+/g, " ").trim();
}

// الـPDF العربي أحياناً بيرجّع الكلام بترتيب أو اتجاه مختلف، فبنجهّز كذا شكل للسطر ونجرّبهم
function lineVariants(items) {
  const asc = items.slice().sort((a, b) => a.transform[4] - b.transform[4]);
  const desc = asc.slice().reverse();
  const same = s => s;
  const rev = s => Array.from(s).reverse().join("");
  return [
    glueItems(desc, true, same),
    glueItems(asc, false, same),
    glueItems(desc, true, rev),
    glueItems(asc, false, rev),
    desc.map(i => i.str).join(" "),
    asc.map(i => i.str).join(" ")
  ];
}

async function readPdfLines(file, onPage) {
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    // نجمع العناصر في سطور حسب الارتفاع
    const rows = {};
    content.items.forEach(it => {
      const y = Math.round(it.transform[5]);
      (rows[y] = rows[y] || []).push(it);
    });
    const ys = Object.keys(rows).map(Number).sort((a, b) => b - a);
    ys.forEach(y => onPage(p, lineVariants(rows[y])));
  }
}

/* ---------- تنزيل النتايج كملف Excel ---------- */
let lastExport = null;

function exportExcel() {
  if (!lastExport) return;
  const head = ["الملف", "الصفحة", "القيمة الأصلية", "الوحدة الأصلية", "بعد التحويل", "الوحدة الجديدة"];
  const aoa = [head].concat(lastExport.rows.map(r => [r.file, r.page, r.value, r.unit, Number(pretty(r.result)), lastExport.target]));
  if (window.XLSX) {
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    const wb = XLSX.utils.book_new();
    wb.Workbook = { Views: [{ RTL: true }] };
    XLSX.utils.book_append_sheet(wb, ws, "UniConvert");
    XLSX.writeFile(wb, "uniconvert.xlsx");
    return;
  }
  // احتياطي لو مكتبة Excel ما اتحملتش (مفيش إنترنت): ملف CSV بيتفتح في Excel
  const csv = "﻿" + aoa.map(row => row.map(c => "\"" + String(c).replace(/"/g, "\"\"") + "\"").join(",")).join("\r\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "uniconvert.csv";
  document.body.appendChild(a);
  a.click();
  a.remove();
}

$("searchBtn").addEventListener("click", async () => {
  const files = $("files").files;
  const word = $("word").value.trim().toLowerCase();
  const cat = $("pdfCategory").value;
  const target = $("pdfTarget").value;
  const status = $("pdfStatus");
  const out = $("pdfResults");
  out.innerHTML = "";
  if (!window.pdfjsLib) { status.textContent = "مكتبة PDF ما اتحملتش، اتأكدي من الإنترنت وحدّثي الصفحة."; return; }
  if (!files.length) { status.textContent = "اختاري ملف PDF واحد على الأقل."; return; }
  if (!word) { status.textContent = "اكتبي كلمة البحث."; return; }

  const rows = [];
  const stats = { lines: 0, wordLines: 0 };
  const sample = [];
  for (let i = 0; i < files.length; i++) {
    status.textContent = "جاري قراءة " + (i + 1) + " من " + files.length + ": " + files[i].name;
    try {
      await readPdfLines(files[i], (page, variants) => {
        stats.lines++;
        if (sample.length < 15) sample.push(normalizeDigits(variants[0]));
        const r = findMeasures(variants, word, cat);
        if (!r.wordFound) return;
        stats.wordLines++;
        r.measures.forEach(m => {
          rows.push({ file: files[i].name, page, original: m.value + " " + m.unitName, value: m.value, unit: m.unitName, result: convert(cat, m.value, m.unitName, target) });
        });
      });
    } catch (e) {
      rows.push({ file: files[i].name, page: "-", original: "تعذّرت قراءة الملف", result: NaN });
    }
  }

  if (!rows.length) {
    if (!stats.lines) status.textContent = "ما اتقراش أي نص من الملف. غالباً الملف مصور (ممسوح ضوئياً).";
    else if (!stats.wordLines) status.textContent = "قريت " + stats.lines + " سطر بس ما لقيتش الكلمة دي فيهم. شوفي النص اللي اتقرأ تحت.";
    else status.textContent = "لقيت الكلمة في " + stats.wordLines + " سطر بس مفيش رقم ووحدة من النوع ده جنبها. جرّبي نوع قياس تاني.";
    const det = document.createElement("details");
    const sum = document.createElement("summary");
    sum.textContent = "النص اللي اتقرأ من الملف (للتشخيص)";
    const pre = document.createElement("pre");
    pre.style.whiteSpace = "pre-wrap";
    pre.style.fontSize = "13px";
    pre.textContent = sample.join("\n") || "(مفيش نص)";
    det.appendChild(sum);
    det.appendChild(pre);
    out.appendChild(det);
    return;
  }
  status.textContent = "لقيت " + rows.length + " قياس.";
  let html = "<table><tr><th>الملف</th><th>الصفحة</th><th>القيمة الأصلية</th><th>بعد التحويل</th></tr>";
  rows.forEach(r => {
    html += "<tr><td>" + esc(r.file) + "</td><td>" + r.page + "</td><td>" + esc(r.original) + "</td><td>" + (isNaN(r.result) ? "-" : pretty(r.result) + " " + target.split(" ")[0]) + "</td></tr>";
  });
  html += "</table>";
  out.innerHTML = html;
  lastExport = { rows: rows.filter(r => !isNaN(r.result)), target };
  const btn = document.createElement("button");
  btn.className = "main";
  btn.textContent = "تنزيل الجدول كملف Excel";
  btn.addEventListener("click", exportExcel);
  out.appendChild(btn);
});
</script>
</body>
</html>
